<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高考知识点打卡器</title>
<meta name="description" content="高考知识点清单、每日打卡与复习计划（离线可用）">
<meta name="theme-color" content="#3b5bdb">
<!--PWA-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="高考打卡">
<!--/PWA-->
<style>
:root{--bg:#f3f5fa;--card:#fff;--text:#1f2937;--sub:#6b7280;--line:#e6e8ef;--pri:#3b5bdb;--pri2:#5b7cfa;--pri-soft:#eaefff;
--c0:#c5cbd6;--c1:#3b82f6;--c2:#16a34a;--c3:#f08c00;--track:#eceff5;--hf:#e03131;--wf:#7048e8;--r:16px;--sh:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1116;--card:#1a1d25;--text:#e6e8ee;--sub:#9aa1ad;--line:#2a2f3b;--pri:#4c6ef5;--pri2:#748ffc;--pri-soft:#1f2842;--c0:#4a5261;--track:#262b36;--wf:#b197fc;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.wrap{max-width:760px;margin:0 auto}
.topbar{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:calc(env(safe-area-inset-top) + 12px) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left))}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--pri);z-index:45;pointer-events:none}
body.noscroll{overflow:hidden}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
.topbar .cd{font-size:13px;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:20px;white-space:nowrap}
.topbar .cd b{font-size:16px;margin:0 2px}
main{padding:12px max(12px,env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.tabbar .wrap{display:flex}
.tabbar button{flex:1;border:0;background:none;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--sub);min-height:56px}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px}
.muted{color:var(--sub);font-size:13px}
.row2{display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:12px;padding:0 16px;min-height:44px;background:var(--pri);color:#fff;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--pri-soft);color:var(--pri)}
.btn.line{background:none;border:1px solid var(--line);color:var(--text)}
.btn.warn{background:#fff0f0;color:#c92a2a}
@media (prefers-color-scheme:dark){.btn.warn{background:#3a1f22;color:#ff8787}}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 auto}
/* 进度条 */
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--track)}
.bar i{display:block;height:100%}
.bar .b2{background:var(--c2)}.bar .b1{background:var(--c1)}.bar .b3{background:var(--c3)}
.bar.thin{height:6px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.l0{background:var(--c0)}.l1{background:var(--c1)}.l2{background:var(--c2)}.l3{background:var(--c3)}
/* 总览 */
.hero{display:flex;gap:14px;align-items:center}
.ring{width:108px;height:108px;border-radius:50%;flex:none;display:grid;place-items:center}
.ring>div{width:80px;height:80px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:22px;line-height:1.1}.ring small{font-size:11px;color:var(--sub)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;flex:1;font-size:13px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}
.kv b{font-weight:600}
.cdcard{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.cdcard .big{font-size:40px;font-weight:800;line-height:1.1}
.cdcard .muted{color:rgba(255,255,255,.85)}
.phase{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.2);margin-left:6px;vertical-align:middle}
.ph1{background:#e7f5ff;color:#1864ab}.ph2{background:#fff4e6;color:#d9480f}.ph3{background:#fff0f6;color:#c2255c}
@media (prefers-color-scheme:dark){.ph1{background:#1b3148;color:#74c0fc}.ph2{background:#3d2a17;color:#ffa94d}.ph3{background:#3d1a2a;color:#f783ac}}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats3 b{display:block;font-size:20px}
.stats3 span{font-size:12px;color:var(--sub)}
details.subj{padding:0}
details.subj>summary{list-style:none;padding:14px;cursor:pointer}
details.subj>summary::-webkit-details-marker{display:none}
.subj-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.subj-t b{font-size:16px}.subj-t b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sc);margin-right:7px;vertical-align:2px}
.subj-body{padding:0 14px 14px;border-top:1px solid var(--line)}
.chrow{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.chrow:last-of-type{border-bottom:0}
.chrow .row2{justify-content:space-between;margin-bottom:4px}
.weak{padding-left:0;margin:0;list-style:none}.weak li{margin:6px 0;font-size:14px}
/* 清单 */
.lhead{position:sticky;top:env(safe-area-inset-top);z-index:15;background:var(--bg);margin:-12px -12px 8px;padding:10px 12px 6px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);font-size:16px;outline:none}
.search input:focus{border-color:var(--pri)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:0 13px;height:36px;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.chip small{color:var(--sub);font-size:11.5px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}.chip.on small{color:rgba(255,255,255,.85)}
.tog{flex:none;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:14px;white-space:nowrap}
.tog.on{background:#fff0f0;border-color:#ffc9c9;color:var(--hf);font-weight:600}
@media (prefers-color-scheme:dark){.tog.on{background:#3a1f22;border-color:#5c2b2f}}
.subsum{font-size:13px;color:var(--sub);margin:4px 2px 10px}
.sub-h{font-size:18px;font-weight:700;margin:16px 4px 6px}
.mod-h{font-size:13px;color:var(--sub);margin:14px 4px 6px;font-weight:600}
.ch{background:var(--card);border-radius:14px;box-shadow:var(--sh);margin-bottom:8px;overflow:hidden}
.ch-h{width:100%;border:0;background:none;text-align:left;padding:12px 14px;display:block}
.ch-h .row2{justify-content:space-between}
.ch-h .nm{font-weight:600;font-size:15px}
.ch-h .ct{font-size:12.5px;color:var(--sub);white-space:nowrap}
.ch-h .bar{margin-top:7px}
.chev{display:inline-block;transition:transform .2s;color:var(--sub);margin-left:4px}
.ch.open .chev{transform:rotate(90deg)}
.ch-b{border-top:1px solid var(--line)}
.ch:not(.open) .ch-b{display:none}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--line);min-height:52px}
.row:last-child{border-bottom:0}
.st{flex:none;width:58px;height:32px;border-radius:16px;border:0;font-size:13px;font-weight:600}
.s0{background:var(--track);color:var(--sub)}
.s1{background:#dbeafe;color:#1d4ed8}
.s2{background:#d3f9d8;color:#2b8a3e}
.s3{background:#ffec99;color:#b35c00}
@media (prefers-color-scheme:dark){.s1{background:#1e3a5f;color:#93c5fd}.s2{background:#1d3b26;color:#8ce99a}.s3{background:#43331a;color:#ffc078}}
.row-main{flex:1;min-width:0;cursor:pointer;padding:4px 0}
.row-t{font-size:14.5px;word-break:break-word}
.row-m{font-size:12px;color:var(--sub);display:flex;gap:8px;margin-top:2px}
.row-m .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.hf{display:inline-block;font-size:11px;line-height:16px;padding:0 5px;border-radius:5px;background:#ffe3e3;color:var(--hf);margin-right:5px;vertical-align:1px;font-weight:600}
@media (prefers-color-scheme:dark){.hf{background:#4a2124}}
.add{flex:none;width:40px;height:40px;border-radius:50%;border:1px dashed var(--line);background:none;font-size:20px;color:var(--pri);line-height:1}
.add.on{background:var(--pri-soft);border:1px solid var(--pri);font-size:16px}
.empty{text-align:center;color:var(--sub);padding:40px 16px}
/* 今日 */
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.chk{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--c0);background:none;color:transparent;font-weight:800;font-size:16px}
.task.done .chk{background:var(--c2);border-color:var(--c2);color:#fff}
.task.done .row-t{text-decoration:line-through;color:var(--sub)}
.x{flex:none;width:38px;height:38px;border:0;background:none;color:var(--sub);font-size:20px;border-radius:50%}
.tag{display:inline-block;font-size:11.5px;padding:0 6px;border-radius:6px;color:#fff;background:var(--c,#888);margin-right:5px;line-height:18px;vertical-align:1px}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bigbtns .btn{min-height:50px;font-size:16px}
.btn.done{background:var(--c2)}
.hm-wrap{overflow-x:auto;padding-bottom:4px}
.hm-grid{display:flex;gap:3px}
.hm-col{display:flex;flex-direction:column;gap:3px}
.hm-col i{width:14px;height:14px;border-radius:3px;display:block}
.hm-lab{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--sub);margin-right:2px}
.hm-lab span{height:14px;line-height:14px}
.hm0{background:var(--track)}.hm1{background:#b2f2bb}.hm2{background:#69db7c}.hm3{background:#40c057}.hm4{background:#2b8a3e}.hmf{background:transparent}
.hm-today{outline:2px solid var(--pri);outline-offset:-1px}
/* 计划 */
.tl{display:flex;border-radius:10px;overflow:hidden;font-size:12px;text-align:center;margin:8px 0}
.tl div{padding:6px 2px;min-width:0}
.wk{padding:0}
.wk-h{padding:12px 14px 6px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.wk-h b{font-size:15px}
.wk.cur{outline:2px solid var(--pri)}
.wk-st{font-size:12px;white-space:nowrap;padding:2px 8px;border-radius:10px;background:var(--track);color:var(--sub)}
.wk.ok .wk-st{background:#d3f9d8;color:#2b8a3e}
@media (prefers-color-scheme:dark){.wk.ok .wk-st{background:#1d3b26;color:#8ce99a}}
.wk-sum{padding:0 14px;display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.wk-sum .tag{font-size:12px;line-height:20px;padding:0 7px}
.wk-tip{padding:6px 14px 0;font-size:12.5px;color:var(--sub)}
.wk-act{padding:10px 14px 12px;display:flex;gap:8px;flex-wrap:wrap}
.wk-b{border-top:1px solid var(--line);padding:6px 14px 12px}
.wk-b h4{margin:10px 0 4px;font-size:13.5px}
.wi{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.wi .dot{flex:none;width:9px;height:9px;border-radius:50%}
.wi span.n{flex:1;min-width:0}
.wi button{flex:none;border:1px solid var(--line);background:none;border-radius:8px;height:34px;padding:0 9px;font-size:12.5px;color:var(--sub)}
.wk textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);min-height:40px;resize:vertical;margin-top:8px;font-size:16px}
.badge{display:inline-block;font-size:11px;background:var(--pri);color:#fff;border-radius:8px;padding:0 6px;margin-left:4px;vertical-align:1px}
/* 设置表单 */
.fl{font-weight:600;font-size:14px;margin:14px 0 8px}
.fl small{font-weight:400;color:var(--sub)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode input,.cc input{position:absolute;opacity:0;pointer-events:none}
.mode span{display:block;border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:64px;background:var(--card)}
.mode b{display:block;font-size:14.5px}.mode small{color:var(--sub);font-size:12px}
.mode input:checked+span{border-color:var(--pri);background:var(--pri-soft)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.cc span{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);font-size:15px}
.cc input:checked+span{border-color:var(--pri);background:var(--pri);color:#fff}
.pick{display:none}
.sf[data-mode="312"] .p312,.sf[data-mode="33"] .p33,.sf[data-mode="li"] .pli,.sf[data-mode="wen"] .pwen{display:block}
.hint{font-size:13px;color:var(--sub);background:var(--bg);padding:10px;border-radius:10px;margin:12px 0 0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.f input{-webkit-appearance:none;appearance:none;display:block;max-width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--card);font-size:16px;color:var(--text);min-width:0;width:100%}
textarea.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--card);font-size:16px;min-height:70px;resize:vertical}
.note-box{background:#fff9db;color:#8a6d00;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.note-box{background:#3a3217;color:#ffe066}}
/* 底部弹层 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none}
.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;overscroll-behavior:contain;background:var(--card);border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;transform:translateY(105%);transition:transform .22s ease;max-height:88vh;max-height:88dvh;overflow-y:auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:17px;margin:4px 0 4px}
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.sts button{height:48px;border-radius:12px;border:2px solid transparent;font-weight:600;font-size:15px}
.sts button.on{border-color:currentColor;box-shadow:0 0 0 2px var(--card) inset}
/* 首次设置 */
.setup{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none}
.setup.show{display:block}
.setup .inner{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px 40px}
.setup h1{font-size:24px;margin:10px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86vw;text-align:center}
.toast.show{opacity:1}
.toast.top{bottom:auto;top:calc(env(safe-area-inset-top) + 14px)}
#printArea{display:none}
/* v2 新增 */
.bn{display:flex;gap:10px;align-items:center;justify-content:space-between;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13.5px;line-height:1.5}
.bn span{flex:1}
.bn .btn{flex:none}
.bn-up{background:var(--pri-soft);color:var(--pri);font-weight:600}
.bn-err{background:#fff0f0;color:#c92a2a}
.bn-wx{background:#fff9db;color:#8a6d00}
@media (prefers-color-scheme:dark){.bn-err{background:#3a1f22;color:#ff8787}.bn-wx{background:#3a3217;color:#ffe066}}
.wf{display:inline-block;font-size:11px;line-height:16px;padding:0 5px;border-radius:5px;background:#f3f0ff;color:var(--wf);margin-right:5px;vertical-align:1px;font-weight:600}
.rv{display:inline-block;font-size:11px;line-height:16px;padding:0 5px;border-radius:5px;background:#e3fafc;color:#0c8599;margin-right:5px;vertical-align:1px;font-weight:600}
@media (prefers-color-scheme:dark){.wf{background:#2b2345}.rv{background:#123238;color:#66d9e8}}
.btn.wbtn{background:#f3f0ff;color:var(--wf);border:1px solid #d0bfff}
@media (prefers-color-scheme:dark){.btn.wbtn{background:#2b2345;border-color:#5f3dc4}}
.btn.ok{background:var(--c2)}
.rvrow{flex-wrap:wrap}
.rvbtns{display:flex;gap:6px;flex:none;margin-left:auto}
.wkplan{margin-top:12px;font-size:13.5px}
.wkplan .bar{margin-top:6px}
.wk.past{opacity:.6}
.sw{display:flex;justify-content:space-between;align-items:center;min-height:44px;cursor:pointer;font-size:15px}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:50px;height:30px;border-radius:15px;background:var(--c0);position:relative;transition:background .2s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--pri)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--pri);outline-offset:2px}
button:focus-visible,.row-main:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
/* 大字号模式 */
html.big body{font-size:17px}
html.big .row-t{font-size:16.5px}
html.big .row-m,html.big .muted{font-size:14.5px}
html.big .chip{font-size:15.5px;height:40px}
html.big .st{width:66px;height:36px;font-size:14.5px}
html.big .card h3{font-size:18px}
html.big .ch-h .nm{font-size:17px}
html.big .ch-h .ct{font-size:14px}
html.big .tabbar button{font-size:13px}
html.big .wi{font-size:15.5px}
html.big .tag,html.big .hf,html.big .wf,html.big .rv{font-size:13px;line-height:19px}
html.big .kv{font-size:15px}
html.big .stats3 span{font-size:13.5px}
html.big .subsum{font-size:14.5px}

/* ---------- 视图：复习计划 ---------- */
function viewPlan() {
  const c = S.setup, t = today(), P = S.plan;
  const seg = (a, b) => (a <= b ? diffDays(a, b) + 1 : 0);
  const d1 = seg(t, c.r1), d2 = seg(t > c.r1 ? t : addDays(c.r1, 1), c.r2), d3 = seg(t > c.r2 ? t : addDays(c.r2, 1), c.exam);
  let h = '<div class="card"><h3>复习阶段</h3>' + (d1 + d2 + d3 ? '<div class="tl">' +
    (d1 ? '<div class="ph1" style="flex:' + d1 + '">一轮 ' + d1 + '天</div>' : '') + (d2 ? '<div class="ph2" style="flex:' + d2 + '">二轮 ' + d2 + '天</div>' : '') + (d3 ? '<div class="ph3" style="flex:' + d3 + '">冲刺 ' + d3 + '天</div>' : '') + '</div>' : '<div class="note-box">高考日期已过，请到「设置」中更新高考日期。</div>') +
    '<p class="muted" style="margin:4px 0">一轮至 ' + c.r1 + '，二轮至 ' + c.r2 + '，高考 ' + c.exam + '（可在设置中修改）。</p>' +
    '<p class="muted" style="margin:4px 0">按剩余天数把各科知识点按章节顺序分配到每周：一轮覆盖全部未掌握；二轮二刷未掌握+高频；冲刺回归高频、需复习与错题。已确认的周在重新生成时保留不变。</p>' +
    '<div class="btns" style="margin-top:10px"><button class="btn" data-act="gen-plan"' + (examOver() ? ' disabled' : '') + '>' + (P ? '重新生成计划' : '生成复习计划') + '</button>' + (P ? '<button class="btn ghost" data-act="confirm-all">全部确认</button>' : '') + '</div></div>';
  if (!P || !P.weeks.length) return h + '<div class="empty">还没有复习计划，点击上方「生成复习计划」。</div>';
  const nConf = P.weeks.filter(w => w.confirmed).length;
  const stale = P.weeks.length && P.weeks[P.weeks.length - 1].end < t;
  h += '<div class="muted" style="margin:0 4px 8px">生成于 ' + P.created + ' · 共 ' + P.weeks.length + ' 周 · 已确认 ' + nConf + '/' + P.weeks.length + ' 周' + (stale ? ' · 计划已过期，请重新生成' : '') + '</div>';
  P.weeks.forEach((w, i) => {
    const cur = w.start <= t && t <= w.end, past = w.end < t, cnt = weekCount(w);
    let mast = 0; subs().forEach(sk => weekIds(w, sk).forEach(id => { if (gs(id) === 2) mast++; }));
    const open = !!S.ui.wkOpen[w.start];
    h += '<section class="card wk' + (cur ? ' cur' : '') + (w.confirmed ? ' ok' : '') + (past ? ' past' : '') + '"><div class="wk-h"><div><b>第' + (i + 1) + '周</b> <span class="muted">' + md(w.start) + '–' + md(w.end) + '</span> <span class="phase ph' + w.ph + '">' + PHN[w.ph] + '</span>' + (cur ? '<span class="badge">本周</span>' : '') + '</div><span class="wk-st">' + (w.confirmed ? '已确认' : '待确认') + '</span></div>' +
      '<div class="wk-sum">' + subs().map(sk => { const n = weekIds(w, sk).length; return n ? '<span class="tag" style="--c:' + SYLLABUS[sk].color + '">' + SYLLABUS[sk].name + ' ' + n + '</span>' : ''; }).join('') + '<span class="muted">共 ' + cnt + ' 个 · 已掌握 ' + mast + '</span></div>' +
      (w.note ? '<div class="wk-tip">备注：' + esc(w.note) + '</div>' : '') +
      '<div class="wk-act"><button class="btn line sm" data-act="wk-open" data-i="' + i + '">' + (open ? '收起明细' : '查看/编辑明细') + '</button><button class="btn sm ' + (w.confirmed ? 'line' : '') + '" data-act="wk-confirm" data-i="' + i + '">' + (w.confirmed ? '取消确认' : '确认本周') + '</button>' + (cur ? '<button class="btn ghost sm" data-act="auto">按本周计划安排今日</button>' : '') + '</div>';
    if (open) {
      h += '<div class="wk-b"><div class="wk-tip" style="padding:4px 0">' + PHD[w.ph] + '</div>';
      subs().forEach(sk => {
        const ids = weekIds(w, sk); if (!ids.length) return;
        h += '<h4>' + subTag(sk) + ids.length + ' 个</h4>' + ids.map(id => { const p = PT[id], s = gs(id); return '<div class="wi"><i class="dot l' + s + '"></i><span class="n">' + badges(p) + esc(p.name) + '<span class="muted"> · ' + esc(p.ch.name) + '</span></span>' + (i < P.weeks.length - 1 ? '<button data-act="wk-next" data-i="' + i + '" data-sk="' + sk + '" data-id="' + id + '">下周</button>' : '') + '<button data-act="wk-rm" data-i="' + i + '" data-sk="' + sk + '" data-id="' + id + '" aria-label="移除">移除</button></div>'; }).join('');
      });
      h += '<textarea data-wknote="' + i + '" placeholder="本周备注（如：周末做一套数学卷、月考安排…）">' + esc(w.note || '') + '</textarea></div>';
    }
    h += '</section>';
  });
  return h;
}

/* ---------- 底部弹层（知识点详情），支持返回键/返回手势关闭 ---------- */
let noteTimer, sheetPushed = false, ignorePop = 0;
function sheetHTML(id) {
  const p = PT[id], s = gs(id), o = S.pts[id] || {}, on = inToday(id);
  return '<div class="grab"></div><div class="muted">' + subTag(p.sk) + esc(p.ch.m) + ' · ' + esc(p.ch.name) + '</div><h2>' + badges(p) + esc(p.name) + '</h2>' +
    '<div class="sts">' + STN.map((n, i) => '<button class="s' + i + (s === i ? ' on' : '') + '" data-act="ss" data-s="' + i + '">' + n + '</button>').join('') + '</div>' +
    '<textarea class="inp" id="noteIn" maxlength="200" rows="2" placeholder="备注（选填）：易错点、错题页码、老师提醒…">' + esc(o.note || '') + '</textarea>' +

    '<div class="btns"><button class="btn ' + (o.w ? 'wbtn' : 'line') + '" data-act="sheet-wrong">' + (o.w ? '取消错题/难点' : '标记错题/难点') + '</button><button class="btn ' + (on ? 'line' : 'ghost') + '" data-act="sheet-add">' + (on ? '移出今日任务' : '加入今日任务') + '</button></div>' +

}
function openSheet(id) {
  if (!PT[id]) return;
  if (sheetId) flushNote();
  sheetId = id;
  $('#sheet').innerHTML = sheetHTML(id);
  $('#mask').classList.add('show'); $('#sheet').classList.add('show');
  document.body.classList.add('noscroll');
  if (!sheetPushed) { try { history.pushState({ gk: 'sheet', tab: S.ui.tab }, ''); sheetPushed = true; } catch (e) { /* 忽略 */ } }
}
function flushNote() {
  const ta = $('#noteIn'); clearTimeout(noteTimer);
  if (ta && sheetId && ta.value.trim() !== ((S.pts[sheetId] && S.pts[sheetId].note) || '')) setNote(sheetId, ta.value.trim());
}
function closeSheet(fromPop) {
  if (!sheetId) return;
  flushNote();
  const id = sheetId; sheetId = null;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('#mask').classList.remove('show'); $('#sheet').classList.remove('show');
  document.body.classList.remove('noscroll');
  if (sheetPushed) { sheetPushed = false; if (!fromPop) { ignorePop++; history.back(); } }
  refreshPoint(id);
}
function fitSheet() {
  const vv = window.visualViewport, sh = $('#sheet'); if (!vv || !sh) return;
  const off = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  sh.style.bottom = off + 'px';
  sh.style.maxHeight = Math.floor(vv.height * 0.9) + 'px';
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitSheet); visualViewport.addEventListener('scroll', fitSheet); }

/* ---------- 标签页切换（返回键从其他页回到总览，再按返回才退出） ---------- */
function goTab(tab) {
  if (tab === S.ui.tab) { window.scrollTo(0, 0); return; }
  const st = history.state || {};
  try {
    if (S.ui.tab === 'dash' && tab !== 'dash') history.pushState({ gk: 'tab', tab }, '');
    else if (tab === 'dash' && st.gk === 'tab') { ignorePop++; history.back(); }
    else history.replaceState({ gk: 'tab', tab }, '');
  } catch (e) { /* 忽略 */ }
  S.ui.tab = tab; save(); render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', e => {
  if (ignorePop > 0) { ignorePop--; return; }
  if (sheetId) { sheetPushed = false; closeSheet(true); return; }
  const tab = (e.state && e.state.gk === 'tab' && e.state.tab) || 'dash';
  if (tab !== S.ui.tab) { S.ui.tab = tab; save(); render(); window.scrollTo(0, 0); }
});

/* ---------- 打印 ---------- */
function doPrint(mode) {
  const c = S.setup, SY = ['□', '◐', '■', '！'];
  const keep = p => mode === 'un' ? gs(p.id) !== 2 : mode === 'w' ? !!(S.pts[p.id] && S.pts[p.id].w) : true;
  let h = '<h1>高考知识点清单' + (mode === 'un' ? '（未掌握）' : mode === 'w' ? '（错题/难点）' : '') + '</h1><p>' + MODES[c.mode].name + ' · ' + subs().map(k => SYLLABUS[k].name).join('、') + ' · 打印日期 ' + today() + ' · 距高考 ' + Math.max(0, daysLeft()) + ' 天</p><p>图例：□ 未学　◐ 学过　■ 掌握　！ 需复习　★ 高频　⚑ 难点</p>';
  subs().forEach(sk => {
    const sub = SYLLABUS[sk], st = stats(sub.pts); let lastM = null, body = '';
    sub.chs.forEach(ch => {
      const ps = ch.pts.filter(keep); if (!ps.length) return;
      if (ch.m !== lastM) { body += '<h3>' + esc(ch.m) + '</h3>'; lastM = ch.m; }
      body += '<h4>' + esc(ch.name) + '</h4><ul>' + ps.map(p => { const o = S.pts[p.id] || {}; return '<li><span class="pb">' + SY[gs(p.id)] + '</span> ' + esc(p.name) + (p.hf ? ' ★' : '') + (o.w ? ' ⚑' : '') + (o.note ? '（' + esc(o.note) + '）' : '') + '</li>'; }).join('') + '</ul>';
    });
    h += '<h2>' + sub.name + '（满分' + fullScore(sk, c.mode) + '）　掌握 ' + st[2] + '/' + sub.pts.length + '</h2>' + (body || '<p>（无）</p>');
  });
  $('#printArea').innerHTML = h;
  setTimeout(() => window.print(), 60);
}

/* ---------- 备份 ---------- */
const backupName = () => '高考打卡备份-' + today() + '.json';
function exportData() { return JSON.stringify({ app: 'gaokao-tracker', version: APP_VERSION, exportedAt: new Date().toISOString(), data: S }); }
function importData(text) {
  let o;
  try { o = JSON.parse(String(text).trim().replace(/^\uFEFF/, '')); } catch (e) { toast('导入失败：内容不是有效的备份（JSON 格式错误）'); return false; }
  const d = isObj(o) && isObj(o.data) ? o.data : o;
  if (!isObj(d) || !d.v || !isObj(d.pts)) { toast('导入失败：这不是本应用的备份文件'); return false; }

/* ---------- 事件 ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': goTab(el.dataset.tab); break;
    case 'go-subj': S.ui.subj = el.dataset.sk; goTab('list'); break;
    case 'subj': {
      S.ui.subj = el.dataset.sk; save(); renderListCtl(); renderList();
      const on = $('#subChips .chip.on'), box = $('#subChips');
      if (on && box) box.scrollLeft = on.offsetLeft - (box.clientWidth - on.offsetWidth) / 2;
      break;
    }
    case 'filter': S.ui.filter = el.dataset.f; S.ui.fclosed = {}; save(); renderListCtl(); renderList(); break;
    case 'hf': S.ui.hf = !S.ui.hf; S.ui.fclosed = {}; el.classList.toggle('on', S.ui.hf); save(); renderListCtl(); renderList(); break;
    case 'expand': case 'collapse':
      listSubs().forEach(sk => SYLLABUS[sk].chs.forEach(ch => { if (filtering()) S.ui.fclosed[ch.key] = a === 'collapse'; else S.ui.open[ch.key] = a === 'expand'; }));
      save(); renderList(); break;
    case 'ch': { const k = el.dataset.k; if (filtering()) S.ui.fclosed[k] = !S.ui.fclosed[k]; else S.ui.open[k] = !S.ui.open[k]; save(); renderList(); break; }
    case 'cyc': setS(id, (gs(id) + 1) % 4); refreshPoint(id); break;
    case 'open': openSheet(id); break;
    case 'add':
      if (inToday(id)) { removeToday(id); toast('已移出今日任务'); } else { addToday(id); toast('已加入今日任务'); }
      refreshPoint(id); break;
    case 'ss': { const s = +el.dataset.s; setS(sheetId, s); $$('#sheet .sts button').forEach((b, i) => b.classList.toggle('on', i === s)); break; }
    case 'sheet-add': {
      if (inToday(sheetId)) removeToday(sheetId); else addToday(sheetId);
      const on = inToday(sheetId); el.textContent = on ? '移出今日任务' : '加入今日任务'; el.className = 'btn ' + (on ? 'line' : 'ghost'); break;
    }
    case 'sheet-wrong': { const w = toggleWrong(sheetId); el.textContent = w ? '取消错题/难点' : '标记错题/难点'; el.className = 'btn ' + (w ? 'wbtn' : 'line'); toast(w ? '已加入错题/难点' : '已取消难点标记'); break; }
    case 'sheet-close': closeSheet(false); break;
    case 'auto': autoSchedule(); break;
    case 'checkin': checkin(); break;
    case 'uncheckin': if (confirm('撤销今天的打卡？')) { delete S.checkins[today()]; save(); render(); } break;
    case 'tdone': toggleDone(id); render(); break;
    case 'tremove': removeToday(id); render(); break;
    case 'carry': {
      const cap = S.setup.daily || 20; let added = 0;
      tasksOf(addDays(today(), -1)).filter(x => !x.done).forEach(x => { if (tasksOf(today()).length < cap && !inToday(x.id)) { addToday(x.id); added++; } });
      toast(added ? '已转入 ' + added + ' 个任务' : '今日任务已达上限'); render(); break;
    }
    case 'rev-ok': case 'rev-no': review(id, a === 'rev-ok'); toast(a === 'rev-ok' ? '很好！下次复习间隔会变长' : '已标为需复习，明天再提醒'); render(); break;
    case 'rev-all': S.ui.revAll = !S.ui.revAll; save(); render(); break;
    case 'rev-add': {
      const cap = S.setup.daily || 20; let added = 0;
      dueList().forEach(p => { if (tasksOf(today()).length < cap) { const l = S.tasks[today()] || (S.tasks[today()] = []); l.push({ id: p.id, done: false, rev: true }); added++; } });
      save(); toast(added ? '已加入 ' + added + ' 个复习任务' : '今日任务已达上限 ' + cap + ' 个'); render(); break;
    }
    case 'gen-plan':
      if (S.plan && !confirm('重新生成会按当前进度重排所有「待确认」的周（已确认的周保留），继续？')) break;
      genPlan(); break;
    case 'confirm-all': S.plan.weeks.forEach(w => { w.confirmed = true; }); save(); toast('已确认全部 ' + S.plan.weeks.length + ' 周计划'); render(); break;
    case 'wk-open': { const w = S.plan.weeks[+el.dataset.i]; S.ui.wkOpen[w.start] = !S.ui.wkOpen[w.start]; save(); render(); break; }
    case 'wk-confirm': { const w = S.plan.weeks[+el.dataset.i]; w.confirmed = !w.confirmed; save(); render(); break; }
    case 'wk-rm': case 'wk-next': {
      const i = +el.dataset.i, sk = el.dataset.sk, w = S.plan.weeks[i];
      w.items[sk] = (w.items[sk] || []).filter(x => x !== id);
      if (a === 'wk-next' && S.plan.weeks[i + 1]) { const nw = S.plan.weeks[i + 1]; nw.items[sk] = [id].concat((nw.items[sk] || []).filter(x => x !== id)); toast('已移到下周'); }
      save(); render(); break;
    }
    case 'setup-finish': case 'save-setup': {
      const root = a === 'setup-finish' ? $('#setup') : $('#setForm');
      const c = readSetup(root);
      if (typeof c === 'string') { toast(c); break; }
      const changed = S.setup && (S.setup.subjects.join() !== c.subjects.join() || S.setup.r1 !== c.r1 || S.setup.r2 !== c.r2 || S.setup.exam !== c.exam);
      S.setup = c; if (a === 'setup-finish') { S.ui.tab = 'dash'; S.ui.subj = 'all'; }
      if (subs().indexOf(S.ui.subj) < 0) S.ui.subj = 'all';
      save(); render(); window.scrollTo(0, 0);
      toast(a === 'setup-finish' ? '设置完成，开始打卡吧！' : changed && S.plan ? '已保存。选科或日期有变化，建议重新生成复习计划' : '设置已保存');
      break;
    }
    case 'export': {
      try {
        const blob = new Blob([exportData()], { type: 'application/json' });
        const url = URL.createObjectURL(blob), link = document.createElement('a');
        link.href = url; link.download = backupName();
        document.body.appendChild(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
        toast(IN_APP ? '若没有开始下载，请改用「复制备份文本」' : '已导出备份文件');
      } catch (err) { toast('导出失败，请改用「复制备份文本」'); }
      break;
    }
    case 'share-export': {
      try {
        const file = new File([exportData()], backupName(), { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: '高考打卡备份' }).catch(() => {});
        else toast('当前浏览器不支持分享文件，请用「复制备份文本」');
      } catch (err) { toast('分享失败，请用「复制备份文本」'); }
      break;
    }
    case 'copy-export': {
      const txt = exportData();
      const fallback = () => { const ta = $('#importText'); ta.value = txt; ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (err) { ok = false; } toast(ok ? '已复制备份文本' : '已放入下方文本框，请长按全选复制'); };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => toast('已复制备份文本，可粘贴到备忘录/微信「文件传输助手」保存'), fallback); else fallback();
      break;
    }
    case 'import-text': { const v = $('#importText').value.trim(); if (!v) toast('请先粘贴备份文本'); else importData(v); break; }
    case 'print': doPrint(el.dataset.mode); break;
    case 'wx-hide': S.ui.wxHide = true; save(); renderBanners(); break;
    case 'sw-update':
      if (swWaiting) { updateRequested = true; swWaiting.postMessage('SKIP_WAITING'); el.textContent = '正在更新…'; setTimeout(() => location.reload(), 3000); }
      break;
    case 'reset':
      if (confirm('确定要清空所有进度、打卡、计划和设置吗？此操作不可撤销。') && confirm('再次确认：真的要重置吗？')) {
        try { localStorage.removeItem(LS); } catch (err) { /* 忽略 */ }
        S = blank(); toast('已重置'); window.scrollTo(0, 0); render();
      }
      break;
  }
});
document.addEventListener('change', e => {
  onSetupChange(e);
  if (e.target.id === 'bigFont') { S.ui.big = e.target.checked; save(); document.documentElement.classList.toggle('big', S.ui.big); }
  if (e.target.id === 'importFile' && e.target.files[0]) {
    const f = e.target.files[0];
    if (f.size > 5e6) { toast('文件太大，不是有效的备份'); e.target.value = ''; return; }
    const r = new FileReader(); r.onload = () => importData(String(r.result)); r.onerror = () => toast('读取文件失败'); r.readAsText(f); e.target.value = '';
  }
});
let qTimer;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { clearTimeout(qTimer); qTimer = setTimeout(() => { S.ui.q = el.value; S.ui.fclosed = {}; save(); renderListCtl(); renderList(); }, 200); }
  if (el.id === 'noteIn' && sheetId) { const id = sheetId; clearTimeout(noteTimer); noteTimer = setTimeout(() => setNote(id, el.value.trim()), 500); }
  if (el.dataset && el.dataset.wknote != null && S.plan) { const w = S.plan.weeks[+el.dataset.wknote]; if (w) { w.note = el.value; clearTimeout(noteTimer); noteTimer = setTimeout(save, 400); } }
});
document.addEventListener('focusin', e => {
  const el = e.target;
  if (el.matches && el.matches('textarea, input[type=search], input[type=number], input[type=date]') && !el.closest('#sheet')) setTimeout(() => { try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) { /* 忽略 */ } }, 300);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetId) closeSheet(false); });
// 跨天自动刷新（App 挂在后台过夜，或一直开着跨过零点）
let lastDay = today();
function dayCheck() { if (today() !== lastDay) { lastDay = today(); if (!sheetId) render(); } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) dayCheck(); });
setInterval(dayCheck, 60000);

/* ---------- 启动 ---------- */
save();
try {
  const st = history.state;
  if (!st || !st.gk) {
    history.replaceState({ gk: 'root' }, '');
    if (S.setup && S.ui.tab !== 'dash') history.pushState({ gk: 'tab', tab: S.ui.tab }, '');
  }
} catch (e) { /* 忽略 */ }
render();

/* ---------- 离线与更新（仅在 http/https 下注册 Service Worker，直接打开本地文件时跳过） ---------- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    const offer = w => { if (w && navigator.serviceWorker.controller) { swWaiting = w; renderBanners(); } };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (w) w.addEventListener('statechange', () => { if (w.state === 'installed') offer(w); });
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (updateRequested) { updateRequested = false; location.reload(); } });
}
window.__gk = { S: () => S, PTS, PT, SYLLABUS, autoSchedule, genPlan, dueList, today, version: APP_VERSION };
})();

</script>
</body>
</html>
